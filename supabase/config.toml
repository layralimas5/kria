# Kria: configuração do projeto Supabase. Preencher project_id depois do `npx supabase link`.
project_id = "kria"

[auth]
site_url = "https://vynkio-ia.com.br"
additional_redirect_urls = ["http://localhost:5231/**", "https://vynkio-ia.com.br/**", "https://www.vynkio-ia.com.br/**"]
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_confirmations = true
# Recuperar senha é por código (não por link): 6 dígitos, válido por 15 minutos.
# Espelha RESET_CODE_LENGTH em src/domain/resetCode.ts.
otp_length = 6
otp_expiry = 900
# Um e-mail de código por minuto por pessoa (o reenvio da tela espera o mesmo tempo).
max_frequency = "60s"

[auth.email.template.recovery]
subject = "Seu código do Vynkio"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Vynkio"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no Vynkio"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso ao Vynkio"
content_path = "./supabase/templates/magic_link.html"

# Remetente próprio (Resend). Sem SMTP próprio, o plano free não aceita template nem remetente.
# A senha é a chave da API do Resend, em RESEND_API_KEY (nunca no repositório).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "nao-responda@vynkio-ia.com.br"
sender_name = "Vynkio"

# Segundo fator por app autenticador. O painel /admin só responde com a sessão em aal2 (0014).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Quem chama estas duas é o fal.ai e o Asaas, não uma pessoa logada.
[functions.fal-webhook]
verify_jwt = false

[functions.asaas-webhook]
verify_jwt = false
