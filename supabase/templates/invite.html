<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#0b0a1a;font-family:Arial,Helvetica,sans-serif;color:#e4e4e7">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0a1a;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#13112a;border-radius:20px;padding:32px">
            <tr>
              <td style="font-size:22px;font-weight:bold;color:#fafafa;padding-bottom:24px">Vynkio</td>
            </tr>
            <tr>
              <td style="font-size:18px;font-weight:bold;color:#fafafa;padding-bottom:8px">Seu convite para o Vynkio chegou</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:22px;color:#a1a1aa;padding-bottom:24px">
                A equipe do Vynkio criou uma conta para você. Clique no botão para escolher sua senha e entrar.
              </td>
            </tr>
            <tr>
              <td align="center" style="background:#7c3aed;border-radius:14px;padding:16px 0;font-weight:bold">
                <a href="{{ .ConfirmationURL }}" style="color:#ffffff;text-decoration:none;font-size:16px;letter-spacing:0">Escolher minha senha</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:20px;color:#71717a;padding-top:24px">
                Não esperava este convite? Ignore este e-mail: a conta só é usada depois que alguém escolhe a senha por este link.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
