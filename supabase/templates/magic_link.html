<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#0b0a1a;font-family:Arial,Helvetica,sans-serif;color:#e4e4e7">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0a1a;padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#13112a;border-radius:20px;padding:32px">
            <tr>
              <td style="font-size:22px;font-weight:bold;color:#fafafa;padding-bottom:24px">Vynkio</td>
            </tr>
            <tr>
              <td style="font-size:18px;font-weight:bold;color:#fafafa;padding-bottom:8px">Seu link de acesso</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:22px;color:#a1a1aa;padding-bottom:24px">
                Clique no botão para entrar no Vynkio. O link vale por pouco tempo e funciona uma vez só.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:8px">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;border-radius:12px;padding:14px 28px">Entrar no Vynkio</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:20px;color:#71717a;padding-top:24px">
                Não pediu para entrar? Ignore este e-mail. Ninguém acessa sua conta sem este link.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
